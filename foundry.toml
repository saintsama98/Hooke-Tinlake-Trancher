# Dependency: forge-std (MIT), as a git submodule. Auth and RAY math are adapted in this repository from
# tinlake-auth and tinlake-math (AGPL-3.0-only); see NOTICE.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
verbosity = 3
fs_permissions = [{ access = "read", path = "./out" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 100

# Pull-request profile: heavier fuzzing.
[profile.pr.fuzz]
runs = 1000

# CI / push-to-main profile: exhaustive fuzzing.
[profile.ci.fuzz]
runs = 50000
max_test_rejects = 262144

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
