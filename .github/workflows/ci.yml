name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: versions
        run: forge --version

      - name: format check
        run: forge fmt --check

      - name: build
        run: forge build

      # LenderDeployer is a deployment script and is deliberately exempt. It
      # embeds the creation bytecode of nine contracts, so it cannot fit under
      # EIP-170 and is never itself deployed on chain. Everything in src/ must
      # fit, and this step fails if anything else exceeds the limit.
      - name: contract sizes
        run: |
          forge build --sizes > sizes.txt || true
          cat sizes.txt
          over=$(awk -F'|' '/^\|/ && $2 !~ /Contract/ {
                   name=$2; runtime=$3;
                   gsub(/^[ \t]+|[ \t]+$/, "", name);
                   gsub(/[ ,]/, "", runtime);
                   if (name != "" && name != "LenderDeployer" && runtime+0 > 24576)
                     print name" ("runtime" bytes)"
                 }' sizes.txt)
          if [ -n "$over" ]; then
            echo "::error::contracts over the EIP-170 runtime limit: $over"
            exit 1
          fi
          echo "all deployable contracts are within the EIP-170 limit"

      # The pull-request profile runs 1000 fuzz runs; the ci profile used on
      # pushes to main runs 50000. Both are declared in foundry.toml.
      - name: test (unit, fuzz, stateful invariants)
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'ci' }}
